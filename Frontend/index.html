<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TODO: replace every occurrence of https://www.your-school-domain.com
         in this file, robots.txt and sitemap.xml with your real production
         domain once you have it - canonical/og/sitemap URLs must be exact,
         not a placeholder, or search engines will index the wrong address. -->

    <title>St. Thomas Convent Hr. Sec. School, Indore | CBSE School, Nursery to Class XII</title>
    <meta
      name="description"
      content="St. Thomas Convent Hr. Sec. School, Indore - a CBSE school for Nursery to Class XII with 80+ experienced teachers, smart classrooms, a robotics lab and 15+ years of academic excellence. Admissions open for 2026-27."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.your-school-domain.com/" />

    <!-- Favicons - amber-circle/navy-graduation-cap mark matching the site's
         own logo (Navbar/Footer), not a generic default. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#0b1520" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.your-school-domain.com/" />
    <meta property="og:title" content="St. Thomas Convent Hr. Sec. School, Indore | CBSE Nursery to Class XII" />
    <meta
      property="og:description"
      content="A CBSE school in Indore with 80+ experienced teachers, smart classrooms, a robotics lab, and 15+ years of academic excellence. Admissions open for 2026-27."
    />
    <meta property="og:site_name" content="St. Thomas Convent Hr. Sec. School" />
    <meta property="og:image" content="https://www.your-school-domain.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="St. Thomas Convent Hr. Sec. School, Indore campus" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="St. Thomas Convent Hr. Sec. School, Indore" />
    <meta
      name="twitter:description"
      content="A CBSE school in Indore for Nursery to Class XII - 80+ teachers, smart classrooms, robotics lab, 15+ years of excellence."
    />
    <meta name="twitter:image" content="https://www.your-school-domain.com/og-image.jpg" />

    <!-- Structured data - EducationalOrganization/School schema. This is what
         lets Google show address, phone, rating and opening hours directly
         in search results instead of just a title + description link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "School",
        "name": "St. Thomas Convent Hr. Sec. School",
        "url": "https://www.your-school-domain.com/",
        "logo": "https://www.your-school-domain.com/icon-512.png",
        "image": "https://www.your-school-domain.com/og-image.jpg",
        "description": "A CBSE school in Indore serving Nursery to Class XII, with 80+ experienced teachers, smart classrooms, a robotics lab and digital library.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "St. Thomas Convent Hr. Sec. School",
          "addressLocality": "Indore",
          "addressRegion": "Madhya Pradesh",
          "addressCountry": "IN"
        },
        "telephone": "+91-98765-43210",
        "email": "admissions@stthomasconvent.edu.in",
        "sameAs": [],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "reviewCount": "300"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  </head>
  <body class="font-body bg-surface text-navy-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
